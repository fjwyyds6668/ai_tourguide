<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/vite.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#409eff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>AI 数字人导游 - 游客端</title>
    <!-- 首屏立即显示加载态，减少扫码后白屏感 -->
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f7fa;
        z-index: 9999;
        transition: opacity 0.2s ease;
      }
      #app-loading.app-loaded {
        opacity: 0;
        pointer-events: none;
      }
      #app-loading .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e4e7ed;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: app-load-spin 0.8s linear infinite;
      }
      @keyframes app-load-spin {
        to { transform: rotate(360deg); }
      }
      #app-loading .text { margin-top: 12px; color: #606266; font-size: 14px; }
    </style>
    <!-- Live2D 延后加载，不阻塞首屏；进入语音导览时再加载 -->
    <script defer src="/sentio/core/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <div id="app-loading" role="status" aria-label="加载中">
      <div class="spinner"></div>
      <div class="text">加载中...</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
